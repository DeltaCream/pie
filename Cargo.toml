[package]
name = "pie"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["password-hash"] }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
fancy-regex = "0.19.2"
hyper = "1.11.1"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand_core = { version = "0.10.1" }
redis = { version = "1.7.0", features = ["tokio-rustls-comp"] }
reqwest = { version = "0.13.5", features = ["json"] }
rustls = "0.23.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
  "chrono",
  "macros",
  "postgres",
  "runtime-tokio",
  "tls-rustls"
] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower_governor = "0.8.0"
tower-http = { version = "0.7.1", features = [
  "auth",
  "compression-gzip",
  "compression-zstd",
  "cors",
  "limit",
  "metrics",
  "request-id",
  "timeout",
  "trace",
  "validate-request"
] }  # for TraceLayer (and CORS if you add it)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = "1.26.1"

[features]
default = []
